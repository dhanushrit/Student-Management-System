<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Student Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Register to start managing student records</p>

    <div id="alertBox" class="alert"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required minlength="3">
        <small class="error" id="usernameError"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <small class="error" id="emailError"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
        <small class="error" id="passwordError"></small>
      </div>

      <div class="field">
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="6">
        <small class="error" id="password2Error"></small>
      </div>

      <button type="submit" class="btn" id="registerBtn">Register</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="index.html">Log in here</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
